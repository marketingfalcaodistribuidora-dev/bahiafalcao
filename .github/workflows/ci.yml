# Portão de qualidade: roda em máquina limpa a cada push e pull request.
# Na Vercel, configure "Deployment Checks" para exigir este check antes de publicar em produção.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Qualidade (formatação, lint, tipos, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # histórico completo para a varredura de segredos

      - name: Procurar segredos (gitleaks, repositório público)
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --no-banner --redact

      - name: Subir PostgreSQL de testes (mesmo compose da máquina local)
        run: docker compose -f infra/dev/docker-compose.yml up -d --wait

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências (lockfile exato)
        run: npm ci

      - name: Variáveis do banco local de testes
        run: cp packages/catalogo-dominio/.env.example packages/catalogo-dominio/.env

      - name: Verificação completa
        run: npm run check
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Simular build da Vercel (produção)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_VERCEL_ENV: production
          NEXT_PUBLIC_VERCEL_PROJECT_PRODUCTION_URL: bahiafalcao.vercel.app
